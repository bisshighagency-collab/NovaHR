<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — NovaHR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="index.html">Nova<span>HR</span></a>
      <nav class="nav-links"><a href="login.html">Already have an account? Log in</a></nav>
    </div>
  </header>

  <div class="narrow" style="padding-top:50px;">
    <div class="card">
      <h2>Create your employee account</h2>
      <div id="alert-box"></div>
      <form id="register-form">
        <label for="name">Full name</label>
        <input type="text" id="name" required />
        <label for="email">Email</label>
        <input type="email" id="email" required />
        <label for="phone">Phone</label>
        <input type="tel" id="phone" />
        <label for="department">Department</label>
        <select id="department"><option value="">— none —</option></select>
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required />
        <div class="spacer"></div>
        <button class="btn block" type="submit">Create Account</button>
      </form>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script>
    (async () => {
      try {
        const { departments } = await Api.get('/departments');
        const sel = document.getElementById('department');
        departments.forEach((d) => sel.insertAdjacentHTML('beforeend', `<option value="${d.id}">${esc(d.name)}</option>`));
      } catch { /* optional; registration still works without it */ }
    })();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = '';
      const body = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim() || null,
        department_id: document.getElementById('department').value || null,
        password: document.getElementById('password').value,
      };
      try {
        const { token, user } = await Api.post('/auth/register', body);
        Auth.setSession(token, user, 'employee');
        window.location.href = 'employee/dashboard.html';
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });
  </script>
</body>
</html>
