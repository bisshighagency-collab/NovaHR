<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In — NovaHR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="index.html">Nova<span>HR</span></a>
      <nav class="nav-links">
        <a href="register.html">Create account</a>
        <a href="index.html">Back home</a>
      </nav>
    </div>
  </header>

  <div class="narrow" style="padding-top:50px;">
    <div class="card">
      <h2>Log In</h2>
      <p class="muted">For employees and administrators. To apply for an internal job opening, sign in to the
        <a href="candidate/login.html">Candidate Portal</a> with these same employee credentials.</p>
      <div id="alert-box"></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <div class="spacer"></div>
        <button class="btn block" type="submit">Log In</button>
      </form>
      <p class="muted" style="margin-top:16px;">No account yet? <a href="register.html">Register as an employee</a>.</p>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script>
    const emailParam = new URLSearchParams(location.search).get('email');
    if (emailParam) document.getElementById('email').value = emailParam;

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const { token, user } = await Api.post('/auth/login', { email, password });
        Auth.setSession(token, user, user.role);
        window.location.href = user.role === 'admin' ? 'admin/dashboard.html' : 'employee/dashboard.html';
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });
  </script>
</body>
</html>
