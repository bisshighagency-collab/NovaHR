<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile — NovaHR</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="dashboard.html">Nova<span>HR</span></a>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="attendance-history.html">Attendance</a>
        <a href="payslips.html">Payslips</a>
        <a href="job-openings.html">Job Openings</a>
        <a href="profile.html" class="active">Profile</a>
        <a href="#" id="logout-link">Log out</a>
      </nav>
    </div>
  </header>

  <div class="narrow" style="padding-top:24px;">
    <div class="card">
      <h2>My Profile</h2>
      <div id="alert-box"></div>
      <form id="profile-form">
        <label for="name">Full name</label>
        <input type="text" id="name" required />
        <label>Email</label>
        <input type="email" id="email" disabled />
        <label for="phone">Phone</label>
        <input type="tel" id="phone" />
        <label for="position">Position in the company</label>
        <input type="text" id="position" placeholder="e.g. Frontend Developer" />
        <label for="location">Work location</label>
        <input type="text" id="location" placeholder="e.g. Yaoundé HQ" />
        <label for="address">Home / mailing address</label>
        <input type="text" id="address" placeholder="e.g. Quartier Bastos, Yaoundé" />
        <p class="muted">Changes here are visible to your admin immediately.</p>
        <div class="spacer"></div>
        <button class="btn block" type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script>
    Auth.requireRole('employee', '../login.html');
    document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); Auth.clear(); window.location.href = '../login.html'; });

    const alertBox = document.getElementById('alert-box');

    (async () => {
      try {
        const { user } = await Api.get('/profile');
        document.getElementById('name').value = user.name;
        document.getElementById('email').value = user.email;
        document.getElementById('phone').value = user.phone || '';
        document.getElementById('position').value = user.position || '';
        document.getElementById('location').value = user.location || '';
        document.getElementById('address').value = user.address || '';
      } catch (err) { showAlert(alertBox, err.message); }
    })();

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const { user } = await Api.put('/profile', {
          name: document.getElementById('name').value.trim(),
          phone: document.getElementById('phone').value.trim() || null,
          position: document.getElementById('position').value.trim() || null,
          location: document.getElementById('location').value.trim() || null,
          address: document.getElementById('address').value.trim() || null,
        });
        localStorage.setItem('novahr_user', JSON.stringify(user));
        showAlert(alertBox, 'Profile updated.', 'success');
      } catch (err) { showAlert(alertBox, err.message); }
    });
  </script>
  <script src="../js/ai-widget.js"></script>
</body>
</html>
